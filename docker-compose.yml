version: "3.9"

services:
  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: tattoo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tattoo_db
      POSTGRES_USER: tattoo_user
      POSTGRES_PASSWORD: tattoo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run init.sql after Alembic creates the tables (via an entrypoint script)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tattoo_user -d tattoo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tattoo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://tattoo_user:tattoo_pass@db:5432/tattoo_db
      SECRET_KEY: ${SECRET_KEY:-super-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      UPLOAD_DIR: /app/uploads
      DEFAULT_OWNER_EMAIL: ${DEFAULT_OWNER_EMAIL:-owner@tattoo.studio}
      DEFAULT_OWNER_PASSWORD: ${DEFAULT_OWNER_PASSWORD:-owner_secure_pass_123}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@tattoo.studio}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin_secure_pass_123}
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  # ── Alembic migration runner (runs once then exits) ────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tattoo_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://tattoo_user:tattoo_pass@db:5432/tattoo_db
    command: >
      sh -c "alembic upgrade head &&
             psql postgresql://tattoo_user:tattoo_pass@db:5432/tattoo_db
             -f /app/sql/init.sql || true"
    restart: "no"

volumes:
  postgres_data:
  uploads_data:
